version: "3.8"

# Production BLUE — ports 8001/5001
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: learner_backend_blue
    network_mode: "host"
    env_file:
      - .env.prod
    environment:
      - BACKEND_PORT=8001
      - ENVIRONMENT=production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: learner_frontend_blue
    network_mode: "host"
    environment:
      - FRONTEND_PORT=5001
