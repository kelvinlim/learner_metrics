# Production: blue-green via active-upstream.conf include
# Switch active color: ./scripts/switch-color.sh [blue|green]

include /home/azureuser/Projects/learner-metrics/nginx/active-upstream.conf;

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
gzip_min_length 1024;

server {
    listen 443 ssl;
    server_name learner.example.com;   # TODO: update with real domain

    ssl_certificate     /etc/ssl/certs/learner.crt;
    ssl_certificate_key /etc/ssl/private/learner.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://learner_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://learner_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
}

server {
    listen 80;
    server_name learner.example.com;
    return 301 https://$host$request_uri;
}
